services:
  postgres:
    image: postgres:17-alpine
    container_name: loomledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loomledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loomledger_dev}
      POSTGRES_DB: ${POSTGRES_DB:-loomledger}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-loomledger} -d $${POSTGRES_DB:-loomledger}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
