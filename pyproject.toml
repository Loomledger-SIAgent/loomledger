[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "loomledger"
version = "0.1.0"
description = "Governed, model-agnostic multi-agent and decision-model workflows with cryptographically verifiable audit trails."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "pyyaml>=6.0.1",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Repository = "https://github.com/Loomledger-SIAgent/loomledger"
Documentation = "https://github.com/Loomledger-SIAgent/loomledger-docs"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "respx>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/loomledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
